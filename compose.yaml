services:
  db:
    image: postgres:17-alpine
    restart: "no"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Defina POSTGRES_DB no .env}
      POSTGRES_USER: ${POSTGRES_USER:?Defina POSTGRES_USER no .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # O volume preserva os dados entre reinícios dos contêineres locais.
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    image: golang:1.27.3-alpine3.24
    restart: "no"
    working_dir: /workspace/apps/api
    command: ["go", "run", "./cmd/migrate", "up"]
    volumes:
      - ./apps/api:/workspace/apps/api
      - go_modules:/go/pkg/mod
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER:?Defina POSTGRES_USER no .env}:${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env}@db:5432/${POSTGRES_DB:?Defina POSTGRES_DB no .env}?sslmode=disable"
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.dev
    restart: "no"
    working_dir: /workspace/apps/api
    # O Air recompila e reinicia só a API quando um arquivo Go montado muda.
    command: ["air", "-c", ".air.toml"]
    volumes:
      # A montagem permite que o Air veja imediatamente os arquivos salvos no host.
      - ./apps/api:/workspace/apps/api
      - go_modules:/go/pkg/mod
      # O binário compilado fica fora do checkout para evitar arquivos com dono root no host.
      - api_tmp:/workspace/apps/api/tmp
    environment:
      # O nome db só resolve dentro da rede do Compose; sslmode=disable é exclusivo do ambiente local.
      DATABASE_URL: "postgres://${POSTGRES_USER:?Defina POSTGRES_USER no .env}:${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env}@db:5432/${POSTGRES_DB:?Defina POSTGRES_DB no .env}?sslmode=disable"
      # Sem conta explícita, o POST permanece indisponível. Isto não é autenticação.
      APP_ENV: ${APP_ENV:-development}
      DEV_ACCOUNT_ID: ${DEV_ACCOUNT_ID:-}
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    healthcheck:
      # A API só fica pronta depois da compilação inicial do Air e da resposta HTTP.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/api/v1/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s
    depends_on:
      db:
        condition: service_healthy
      migrate:
        # O primeiro up só expõe a API após criar as tabelas.
        condition: service_completed_successfully

volumes:
  postgres_data:
  go_modules:
  api_tmp:
